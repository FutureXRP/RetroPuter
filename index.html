<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log On to 1990</title>
<meta name="description" content="Boot up a home computer from 1990, 1995 or 2000. Dial in, surf the early Web, and play the games people played. Switch years any time.">
<meta property="og:title" content="RetroPuter: Log On to 1990">
<meta property="og:description" content="Boot up a home computer from 1990, 1995 or 2000. Dial in, surf the early Web, and play the games people played. Switch years any time.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/retro.css">
</head>
<body>
<div id="room" aria-label="A computer on a desk"><div class="rm-wall"></div><div class="rm-desk"></div><div class="rm-rig"></div><div class="rm-ui"></div><aside class="rm-ad" aria-label="Advertisement" hidden><small>Advertisement</small><a class="rm-ad-box" href="advertise.html"></a></aside></div>
<div id="glare" aria-hidden="true"></div>
<div id="screen" class="crt">

  <section id="st-power" class="stage on" aria-label="Computer is off">
    <div class="power-box">
      <h1 id="pw-head">It's 1990.<br>The computer is off.</h1>
      <p id="pw-blurb"></p>
      <div class="eras" id="pw-eras" role="group" aria-label="Pick a year"></div>
      <button class="pwr" id="pwr"><span class="led"></span>Power on</button>
      <small>Headphones make the modem sound even better. You can switch years any time.</small>
    </div>
  </section>

  <section id="st-sponsor" class="stage" aria-label="A message from our sponsor"><div class="sp-wrap"><small>A message from our sponsor</small><a class="sp-box" href="advertise.html"></a><div class="sp-foot"><div class="sp-bar sunken"><i></i></div><button class="btn sp-skip">Skip ad</button></div></div></section>
  <section id="st-bios" class="stage" aria-live="polite"><pre id="bios"></pre></section>

  <section id="st-splash" class="stage"></section>

  <section id="st-desk" class="stage">
    <div id="layer"></div>
    <div id="startmenu" class="raised" role="menu"><div class="side"></div><div class="items"></div></div>
    <div id="tasks" class="raised">
      <button class="btn off" id="offbtn"></button>
      <div class="ql" id="ql" hidden></div>
      <div id="tasklist"></div>
      <button class="btn twb" id="tw-task"></button>
      <div id="tray" class="sunken"><span class="neticon"></span><span id="clock"></span></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <canvas id="saver"></canvas>
  </section>

  <section id="st-bye" class="stage">
    <div><p class="quit" id="byeText"></p><button class="btn" id="relight" hidden>Turn it back on</button></div>
  </section>

  <button id="skip">Skip the startup</button>
  <button id="tw-float" title="Switch to another year"></button>
  <div id="tw-panel" class="raised" role="dialog" aria-label="Time machine"></div>
  <div id="crt-overlay"></div>
</div>
